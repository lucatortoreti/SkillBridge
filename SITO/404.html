<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada | SkillBridge</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
  :root{color-scheme:light;--paper:#F1F5FB;--ink:#0D2342;--muted:#55658A;--volt:#2B70E4}
  @media (prefers-color-scheme:dark){:root{color-scheme:dark;--paper:#071322;--ink:#EAF1FC;--muted:#93A6C6;--volt:#5F97F8}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);
       color:var(--muted);font-family:"IBM Plex Sans",Helvetica,Arial,sans-serif;padding:24px}
  .b{text-align:center;max-width:44ch}
  .c{font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:800;font-size:clamp(56px,14vw,96px);
     color:var(--ink);letter-spacing:-.04em;line-height:1}
  h1{font-family:Archivo,Helvetica,Arial,sans-serif;font-weight:700;font-size:22px;color:var(--ink);
     margin:14px 0 10px;letter-spacing:-.02em}
  p{margin:0 0 26px;font-size:16px;line-height:1.6}
  a{display:inline-block;background:var(--volt);color:#fff;text-decoration:none;font-weight:600;
    padding:12px 22px;border-radius:999px;font-size:15px}
</style>
</head>
<body>
  <div class="b">
    <div class="c">404</div>
    <h1>Este puente no lleva a ninguna parte</h1>
    <p>La página que buscas no existe o ha cambiado de dirección.</p>
    <a href="/">Volver al inicio</a>
  </div>
</body>
</html>
